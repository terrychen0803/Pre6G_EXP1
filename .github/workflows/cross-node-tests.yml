name: Cross-node workflow tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cross-node-tests.yml'
      - 'scripts/run_cross_node_dryrun.py'
      - 'scripts/run_experiment_pipeline.py'
      - 'tests/test_cross_node_dryrun.py'
      - 'tests/test_experiment_pipeline.py'
      - 'tests/test_validation_runs.py'
      - 'scripts/plan_validation_runs.py'
      - 'scripts/run_validation_jobs.py'
      - 'scripts/evaluate_validation_runs.py'
      - 'scripts/normalize_pdu_excel.py'
      - 'scripts/summarize_validation_series.py'
      - 'tests/test_exp1_evaluation.py'
      - 'examples/yolo26/**'
      - 'k8s/formal/**'
      - 'models/**'
      - 'src/**'
      - 'pyproject.toml'
      - 'configs/**'
      - 'tests/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'requirements*.txt'
      - 'k8s/nsys2026-rtx-smoke.yaml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_manifests.py k8s/formal/*.yaml k8s/nsys2026-rtx-smoke.yaml examples/yolo26/*job.yaml
