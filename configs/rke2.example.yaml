# Anonymized portable template. Fill real bindings only in ignored *.local.yaml.
schema_version: pre6g.cross-node-dryrun-config/v2
experiment_stage: formal-experiment
test_purpose: dryrun-full-workload-prediction
production_result: false
long_detector_profile: yolo-v2-long
namespace: experiments
source_job: examples/yolo26/formal-40min-source-job.yaml
artifact_pvc: pre6g-artifacts
collector_image: busybox:1.36
collector_node: master-node
dcgm_exporter:
  namespace: gpu-operator
  label_selector: app=nvidia-dcgm-exporter
  port: 9400
candidates:
- node: worker-4090
  device_id: RTX4090
  profile_job_template: k8s/formal/yolo26-rtx4090-formal-40min-dryrun-120s.yaml
  runtime_model: models/runtime/RTX4090_yolo_soft_gate_v1.json
  power_bundle: models/power/bundles/pdu1-outlet1-20260416-20260612
  gpu_uuid: REPLACE_WITH_VERIFIED_GPU_UUID
  netdata_url: http://NETDATA_PARENT:19999/host/REPLACE_HOSTNAME
  power_binding_node: REPLACE_WITH_MANIFEST_NODE
- node: worker-5090
  device_id: RTX5090
  profile_job_template: k8s/formal/yolo26-rtx5090-formal-40min-dryrun-120s.yaml
  runtime_model: models/runtime/RTX5090_yolo_trace_only_v1.json
  power_bundle: models/power/bundles/pdu1-outlet7-20260416-20260612
  gpu_uuid: REPLACE_WITH_VERIFIED_GPU_UUID
  netdata_url: http://NETDATA_PARENT:19999/host/REPLACE_HOSTNAME
  power_binding_node: REPLACE_WITH_MANIFEST_NODE
collector_tolerations:
- key: node-role.kubernetes.io/control-plane
  operator: Exists
  effect: NoSchedule
- key: node-role.kubernetes.io/master
  operator: Exists
  effect: NoSchedule
deployment:
  gpu_resource: nvidia.com/gpu
  gpu_count: 1
  runtime_class: nvidia
  nsight_host_path: /opt/nvidia/nsight-systems-cli/2026.5.1
  nsight_cli: /opt/pre6g/nsight/target-linux-x64/nsys
  storage_class: ceph-filesystem
